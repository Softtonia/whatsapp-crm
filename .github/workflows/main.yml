
name: Deploy WhatsApp CRM Frontend

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsappcrm-frontend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Validate frontend project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::package.json not found in repository root."
            echo "If the frontend is in a subdirectory, configure the workflow for that directory."
            exit 1
          fi

          node <<'NODE'
          const p = require('./package.json');

          console.log('Project:', p.name || '(unnamed)');
          console.log('Scripts:', JSON.stringify(p.scripts || {}, null, 2));

          if (!p.dependencies?.next && !p.devDependencies?.next) {
            console.error('Next.js dependency is missing.');
            process.exit(1);
          }

          if (!p.scripts?.build || !p.scripts?.start) {
            console.error('Both build and start scripts are required.');
            process.exit(1);
          }
          NODE

          if [[ ! -f package-lock.json ]]; then
            echo "::error::package-lock.json is required for npm ci."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://whatsappcrmapi.softtonia.com/api
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d .next ]]; then
            echo "::error::Next.js build output .next was not generated."
            exit 1
          fi

          test -f package.json
          test -f package-lock.json
          echo "Frontend build verified."

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"

          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::DEV_SSH_KEY or DEV_SSH_KNOWN_HOSTS is missing."
            exit 1
          fi

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_PORT: ${{ secrets.DEV_PORT }}
          DEPLOY_USER: ${{ secrets.DEV_USER }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEV_HOST secret is missing}"
          : "${DEPLOY_USER:?DEV_USER secret is missing}"

          PORT="${DEPLOY_PORT:-22}"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "SSH connection successful"; node --version; npm --version; sudo -n true'

      - name: Deploy release and restart application
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_PORT: ${{ secrets.DEV_PORT }}
          DEPLOY_USER: ${{ secrets.DEV_USER }}
          DEPLOY_BASE_PATH: ${{ secrets.DEV_BASE_PATH }}
        run: |
          set -Eeuo pipefail

          PORT="${DEPLOY_PORT:-22}"
          BASE="${DEPLOY_BASE_PATH:-/var/www/whatsappcrm.softtonia.com}"

          if [[ "$BASE" != "/var/www/whatsappcrm.softtonia.com" ]]; then
            echo "::error::Unexpected deployment path. Check DEV_BASE_PATH."
            exit 1
          fi

          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          REMOTE_TMP="/tmp/whatsappcrm-${RELEASE}.tar.gz"

          # Transfer the built frontend, not the Git repository.
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=.env.production \
            -czf /tmp/whatsappcrm-release.tar.gz \
            .next package.json package-lock.json \
            public next.config.js next.config.mjs next.config.ts \
            2>/dev/null || {
              # Optional Next.js config files may not all exist.
              rm -f /tmp/whatsappcrm-release.tar.gz
              FILES=(.next package.json package-lock.json)
              [[ ! -d public ]] || FILES+=(public)
              [[ ! -f next.config.js ]] || FILES+=(next.config.js)
              [[ ! -f next.config.mjs ]] || FILES+=(next.config.mjs)
              [[ ! -f next.config.ts ]] || FILES+=(next.config.ts)
              tar --exclude=.env --exclude=.env.local \
                -czf /tmp/whatsappcrm-release.tar.gz "${FILES[@]}"
            }

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            /tmp/whatsappcrm-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_TMP"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$BASE' '$RELEASE' '$REMOTE_TMP'" <<'REMOTE'
          set -Eeuo pipefail

          BASE="$1"
          RELEASE="$2"
          ARCHIVE="$3"
          RELEASE_DIR="$BASE/releases/$RELEASE"
          PREVIOUS="$(readlink -f "$BASE/current" 2>/dev/null || true)"
          SWITCHED=0

          cleanup() {
            sudo rm -f "$ARCHIVE"
          }
          trap cleanup EXIT

          # The deploy user needs passwordless sudo for these operations.
          sudo install -d -m 755 "$BASE" "$BASE/releases"
          sudo install -d -m 755 "$RELEASE_DIR"

          sudo tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          # Install production dependencies. Next.js must be in dependencies,
          # not only devDependencies.
          sudo bash -c "cd '$RELEASE_DIR' && npm ci --omit=dev"

          # Create a release-specific PM2 configuration.
          sudo tee "$RELEASE_DIR/ecosystem.config.cjs" >/dev/null <<EOF
          module.exports = {
            apps: [{
              name: "whatsappcrm-next",
              cwd: "$RELEASE_DIR",
              script: "node_modules/next/dist/bin/next",
              args: ["start", "--hostname", "127.0.0.1", "--port", "3105"],
              instances: 1,
              exec_mode: "fork",
              autorestart: true,
              max_restarts: 10,
              env: {
                NODE_ENV: "production",
                PORT: "3105",
                NEXT_PUBLIC_API_BASE_URL: "https://whatsappcrmapi.softtonia.com/api"
              }
            }]
          };
          EOF

          # Atomically point current to the new release.
          sudo ln -s "$RELEASE_DIR" "$BASE/current.new"
          sudo mv -Tf "$BASE/current.new" "$BASE/current"
          SWITCHED=1

          # Keep the existing root PM2 daemon and unrelated apps untouched.
          sudo pm2 delete whatsappcrm-next >/dev/null 2>&1 || true
          sudo pm2 start "$RELEASE_DIR/ecosystem.config.cjs"

          # Confirm that the application actually serves HTTP.
          HEALTHY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3105/ -o /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [[ "$HEALTHY" != "1" ]]; then
            echo "Frontend health check failed."

            sudo pm2 logs whatsappcrm-next --lines 80 --nostream || true

            if [[ -n "$PREVIOUS" && -d "$PREVIOUS" ]]; then
              sudo ln -s "$PREVIOUS" "$BASE/current.rollback"
              sudo mv -Tf "$BASE/current.rollback" "$BASE/current"
              sudo pm2 delete whatsappcrm-next >/dev/null 2>&1 || true
              sudo pm2 start "$PREVIOUS/ecosystem.config.cjs" || true
            fi

            exit 1
          fi

          echo "Frontend health check passed."
          sudo pm2 status whatsappcrm-next
          REMOTE

      - name: Clean up runner
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/deploy_key"
          rm -f /tmp/whatsappcrm-release.tar.gz
